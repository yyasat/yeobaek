name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Inject native plugin + activity
        run: |
          DEST=android/app/src/main/java/com/yeobaek/browser
          mkdir -p "$DEST"
          cp native/android/MainActivity.java "$DEST/"
          cp native/android/YeobaekNativePlugin.java "$DEST/"

      - name: Grant webview permissions + immersive theme
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "INTERNET" not in s:
              s = s.replace('<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.INSTALL_SHORTCUT"/>\n'
                  '    <application', 1)
          p.write_text(s)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yeobaek-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
